name: Release - Build & Push Images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # triggers on semantic version tags only, e.g. v1.2.3

jobs:
  tag-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install go-task (task)
        run: |
          curl -sSfL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Ensure buildx builder is available
        run: docker buildx inspect --bootstrap

      - name: Build and push multi-arch images (Taskfile)
        env:
          DOCKER_BUILDKIT: 1
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          task build:all-multi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
