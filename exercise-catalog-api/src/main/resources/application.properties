spring.application.name=exercise-catalog-api
server.port=${CATALOG_API_PORT:8090}

# Same Postgres database as the Django app; reuses the SQL_* variables from .env.dev
spring.datasource.url=jdbc:postgresql://${SQL_HOST:localhost}:${SQL_PORT:5432}/${SQL_DATABASE:benergy_api_dev}
spring.datasource.username=${SQL_USER:hello_django}
spring.datasource.password=${SQL_PASSWORD:hello_django}

# Django owns the schema (migrations), so Hibernate must never create or alter tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
